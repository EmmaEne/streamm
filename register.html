<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join The Movement | Glamour Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-editorial {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            min-height: 100vh;
        }

        .auth-visual-side {
            background: linear-gradient(rgba(10, 8, 6, 0.4), rgba(10, 8, 6, 0.4)), url('./img/glam-earlybird.png');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 80px;
        }

        .auth-form-side {
            background: var(--glam-bg);
            padding: 100px 80px;
            overflow-y: auto;
        }

        .input-editorial {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--glass-border);
            padding: 20px 0;
            font-size: 24px;
            font-family: 'Outfit';
            color: var(--glam-white);
            margin-bottom: 40px;
            outline: none;
            transition: border-color 0.4s;
        }

        .input-editorial:focus {
            border-color: var(--glam-cyan);
        }

        .input-label {
            font-size: 12px;
            font-weight: 800;
            color: var(--glam-gold);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .form-grid-editorial {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        @media (max-width: 1024px) {
            .auth-editorial { grid-template-columns: 1fr; }
            .auth-visual-side { display: none; }
            .auth-form-side { padding: 60px 40px; }
            .form-grid-editorial { grid-template-columns: 1fr; gap: 0; }
        }
    </style>
</head>

<body>
    <!-- ================= PRELOADER ================= -->
    <div class="glam-preloader" id="preloader">
        <svg class="loader-logo" viewBox="0 0 100 100">
            <g transform="translate(50,50)" fill="currentColor">
                <ellipse cx="0" cy="-22" rx="10" ry="20" transform="rotate(0)"/>
                <ellipse cx="0" cy="-22" rx="10" ry="20" transform="rotate(60)"/>
                <ellipse cx="0" cy="-22" rx="10" ry="20" transform="rotate(120)"/>
                <ellipse cx="0" cy="-22" rx="10" ry="20" transform="rotate(180)"/>
                <ellipse cx="0" cy="-22" rx="10" ry="20" transform="rotate(240)"/>
                <ellipse cx="0" cy="-22" rx="10" ry="20" transform="rotate(300)"/>
                <circle cx="0" cy="0" r="8"/>
            </g>
        </svg>
    </div>

    <div class="auth-editorial page-fade-in">
        <div class="auth-visual-side">
            <h1 class="display-title" style="color: var(--glam-white);">SECURE<br>YOUR<br><span class="text-gold">SLOT</span></h1>
            <div style="margin-top: 60px; border-top: 2px solid var(--glam-gold); padding-top: 30px; max-width: 400px;">
                <p class="text-gold" style="font-weight: 900; font-size: 16px; letter-spacing: 3px; margin-bottom: 10px;">EARLY BIRD FEE</p>
                <p style="font-size: 48px; font-family: 'Outfit'; font-weight: 900; color: var(--glam-white);">£7 (₦14,000)</p>
            </div>
        </div>

        <div class="auth-form-side">
            <a href="index.html" style="margin-bottom: 80px; display: block; font-weight: 900; color: var(--glam-gold); font-size: 14px; letter-spacing: 2px;">← RETURN HOME</a>
            <h2 class="section-title" style="color: var(--glam-white); margin-bottom: 20px;">THE APPLICATION</h2>
            <p style="color: var(--glam-text-muted); font-size: 20px; margin-bottom: 80px; font-weight: 500;">Complete your digital profile to join the movement.</p>

            <form id="registerForm">
                <div class="field-group">
                    <span class="input-label">Full Name</span>
                    <input type="text" id="fullName" class="input-editorial" placeholder="ADAEZE OKAFOR" required>
                </div>

                <div class="field-group">
                    <span class="input-label">Digital Email</span>
                    <input type="email" class="input-editorial" placeholder="PARTNER@GLAMOUR.APP" required>
                </div>

                <div class="field-group">
                    <span class="input-label">Mobile Number (WhatsApp)</span>
                    <input type="tel" class="input-editorial" placeholder="+234 ..." required>
                </div>


                <div style="margin-bottom: 40px; display: flex; gap: 10px; align-items: flex-start;">
                    <input type="checkbox" required style="margin-top: 4px;">
                    <p style="font-size: 12px; color: var(--glam-text-muted);">I agree to the Partnership rules and acknowledge the movement.</p>
                </div>

                <button type="submit" class="btn-movement-editorial" style="width: 100%; text-align: center; cursor: pointer;">PROCEED TO PAYMENT</button>

            </form>
        </div>
    </div>

    <script>
        // Preloader
        window.addEventListener('load', () => {
            document.getElementById('preloader').classList.add('hidden');
        });

        document.getElementById('registerForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value;
            localStorage.setItem('fx_username', fullName);
            
            document.getElementById('preloader').classList.remove('hidden');
            setTimeout(() => { window.location.href = 'payments.html'; }, 1000);
        });

        // Smooth Transitions
        document.querySelectorAll('a').forEach(anchor => {
            anchor.addEventListener('click', function(e) {
                const href = this.getAttribute('href');
                if (href && !href.startsWith('#') && !href.startsWith('https://')) {
                    e.preventDefault();
                    document.getElementById('preloader').classList.remove('hidden');
                    setTimeout(() => { window.location.href = href; }, 800);
                }
            });
        });
    </script>
</body>

</html>
