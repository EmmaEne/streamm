<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glamour — Editorial Life. Euro Earnings.</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- ================= PRELOADER ================= -->
    <div class="glam-preloader" id="preloader">
        <svg class="loader-logo" viewBox="0 0 100 100">
            <g transform="translate(50,50)" fill="currentColor">
                <ellipse cx="0" cy="-22" rx="10" ry="20" transform="rotate(0)"/>
                <ellipse cx="0" cy="-22" rx="10" ry="20" transform="rotate(60)"/>
                <ellipse cx="0" cy="-22" rx="10" ry="20" transform="rotate(120)"/>
                <ellipse cx="0" cy="-22" rx="10" ry="20" transform="rotate(180)"/>
                <ellipse cx="0" cy="-22" rx="10" ry="20" transform="rotate(240)"/>
                <ellipse cx="0" cy="-22" rx="10" ry="20" transform="rotate(300)"/>
                <circle cx="0" cy="0" r="8"/>
            </g>
        </svg>
        <div class="loader-text" style="font-family: 'Outfit'; font-weight: 900; color: var(--glam-gold); margin-top: 20px; letter-spacing: 5px;">GLAMOUR</div>
    </div>

    <div class="page-fade-in">
    <!-- ================= NAVIGATION ================= -->
    <nav class="nav-editorial" id="mainNav">
        <a href="index.html" class="nav-logo">
            <svg width="28" height="28" viewBox="0 0 100 100">
                <g transform="translate(50,50)" fill="currentColor">
                    <ellipse cx="0" cy="-22" rx="10" ry="20" transform="rotate(0)"/>
                    <ellipse cx="0" cy="-22" rx="10" ry="20" transform="rotate(60)"/>
                    <ellipse cx="0" cy="-22" rx="10" ry="20" transform="rotate(120)"/>
                    <ellipse cx="0" cy="-22" rx="10" ry="20" transform="rotate(180)"/>
                    <ellipse cx="0" cy="-22" rx="10" ry="20" transform="rotate(240)"/>
                    <ellipse cx="0" cy="-22" rx="10" ry="20" transform="rotate(300)"/>
                    <circle cx="0" cy="0" r="8"/>
                </g>
            </svg>
            <span>GLAMOUR</span>
        </a>

        <div class="nav-links">
            <a href="register.html" class="nav-cta">SIGN UP</a>
        </div>
    </nav>

    <!-- ================= HERO ================= -->
    <header style="min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 var(--gutter);">
        <div data-reveal>
            <h1 style="font-family: 'Outfit'; font-size: clamp(48px, 10vw, 120px); text-transform: uppercase; line-height: 0.9; margin-bottom: 24px; color: var(--glam-white);">
                TALK. CONNECT.<br><span class="text-gold">EARN.</span>
            </h1>
            <p style="font-size: 18px; color: var(--glam-text-muted); margin-bottom: 48px; max-width: 600px; margin-left: auto; margin-right: auto;">
                The future of digital connection is here. Secure your spot in the movement and start earning in Euros today.
            </p>
            <a href="register.html" class="btn-movement-editorial" style="font-size: 20px; padding: 20px 60px;">SIGN UP NOW</a>
        </div>
    </header>

    <!-- ================= FOOTER ================= -->
    <footer style="padding: 40px var(--gutter); border-top: 1px solid var(--glass-border); background: var(--glam-bg-accent);">
        <div class="container-fluid" style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h4 style="font-size: 18px; color: var(--glam-white); font-family: 'Outfit';">GLAMOUR</h4>
                <p style="font-size: 10px; margin-top: 5px;">&copy; 2026. ALL RIGHTS RESERVED.</p>
            </div>
            <div style="display: flex; gap: 30px; font-size: 10px; font-weight: 700;">
                <a href="#">INSTAGRAM</a>
                <a href="#">TWITTER</a>
            </div>
        </div>
    </footer>
    </div> <!-- End Page Fade In -->

    <script>
        // Preloader
        window.addEventListener('load', () => {
            document.getElementById('preloader').classList.add('hidden');
        });

        // Nav Scroll
        window.addEventListener('scroll', () => {
            const nav = document.getElementById('mainNav');
            if (window.scrollY > 50) nav.classList.add('scrolled');
            else nav.classList.remove('scrolled');
        });

        // Reveal on scroll
        const reveal = () => {
            const elements = document.querySelectorAll('[data-reveal]');
            elements.forEach(el => {
                const top = el.getBoundingClientRect().top;
                if (top < window.innerHeight * 0.85) {
                    el.classList.add('revealed');
                }
            });
        };
        window.addEventListener('scroll', reveal);
        window.addEventListener('load', reveal);

        // Smooth Page Transitions
        document.querySelectorAll('a').forEach(anchor => {
            anchor.addEventListener('click', function(e) {
                const href = this.getAttribute('href');
                if (href && !href.startsWith('#') && !href.startsWith('https://')) {
                    e.preventDefault();
                    document.getElementById('preloader').classList.remove('hidden');
                    setTimeout(() => { window.location.href = href; }, 800);
                }
            });
        });
    </script>
</body>

</html>
