<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Recovery | Glamour</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .input-editorial {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--glass-border);
            padding: 15px 0;
            font-size: 18px;
            font-family: 'Outfit';
            color: var(--glam-white);
            margin-bottom: 30px;
            outline: none;
            transition: border-color 0.4s;
        }

        .input-editorial:focus {
            border-color: var(--glam-gold);
        }

        .input-label {
            font-size: 11px;
            font-weight: 800;
            color: var(--glam-gold);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        @media (max-width: 1024px) {
            .split-screen { grid-template-columns: 1fr; }
            .split-visual { display: none; }
            .split-content { padding: 80px 40px; }
        }
    </style>
</head>

<body>
    <!-- ================= PRELOADER ================= -->
    <div class="glam-preloader" id="preloader">
        <svg class="loader-logo" viewBox="0 0 100 100">
            <g transform="translate(50,50)" fill="currentColor">
                <ellipse cx="0" cy="-22" rx="10" ry="20" transform="rotate(0)"/>
                <ellipse cx="0" cy="-22" rx="10" ry="20" transform="rotate(60)"/>
                <ellipse cx="0" cy="-22" rx="10" ry="20" transform="rotate(120)"/>
                <ellipse cx="0" cy="-22" rx="10" ry="20" transform="rotate(180)"/>
                <ellipse cx="0" cy="-22" rx="10" ry="20" transform="rotate(240)"/>
                <ellipse cx="0" cy="-22" rx="10" ry="20" transform="rotate(300)"/>
                <circle cx="0" cy="0" r="8"/>
            </g>
        </svg>
    </div>

    <div class="split-screen page-fade-in">
        <div class="split-visual" style="background-image: linear-gradient(rgba(10, 8, 6, 0.4), rgba(10, 8, 6, 0.4)), url('./img/glam-earlybird.png'); padding: 60px;">
            <h1 style="font-size: 60px; color: var(--glam-white); line-height: 0.8; font-family: 'Outfit'; font-weight: 900;">KEY<br><span class="text-gold">DISPATCH</span><br>SYSTEM.</h1>
        </div>

        <div class="split-content" style="display: flex; flex-direction: column; justify-content: center;">
            <div style="max-width: 400px; margin: 0 auto; width: 100%;" id="formView">
                <a href="login.html" style="margin-bottom: 40px; display: block; font-weight: 900; color: var(--glam-gold); font-size: 12px; letter-spacing: 1px;">← BACK TO SIGN IN</a>
                <h2 style="font-size: 32px; color: var(--glam-white); margin-bottom: 8px; font-family: 'Outfit'; font-weight: 900;">RECOVERY</h2>
                <p style="color: var(--glam-text-muted); margin-bottom: 40px; font-size: 14px;">Enter your digital email to initiate the reset sequence.</p>

                <form id="recoverForm">
                    <div class="field-group">
                        <span class="input-label">Digital Email</span>
                        <input type="email" id="email" class="input-editorial" placeholder="partner@glamour.app" required>
                    </div>

                    <button type="submit" class="btn-movement-editorial" style="width: 100%; text-align: center; cursor: pointer; padding: 16px;">SEND RESET KEY</button>
                </form>
            </div>

            <div style="max-width: 400px; margin: 0 auto; width: 100%; text-align: center; display: none;" id="successView">
                <i class="bi bi-shield-check" style="font-size: 80px; color: var(--glam-cyan); margin-bottom: 30px; display: block;"></i>
                <h2 style="font-size: 32px; color: var(--glam-white); margin-bottom: 8px; font-family: 'Outfit'; font-weight: 900;">KEY DISPATCHED</h2>
                <p style="color: var(--glam-text-muted); margin-bottom: 40px; font-size: 14px;">Check your secure inbox for reset instructions.</p>
                <a href="login.html" class="btn-movement-editorial" style="display: block;">RETURN TO SIGN IN</a>
            </div>
        </div>
    </div>

    <script>
        // Preloader
        window.addEventListener('load', () => {
            document.getElementById('preloader').classList.add('hidden');
        });

        document.getElementById('recoverForm').addEventListener('submit', (e) => {
            e.preventDefault();
            document.getElementById('formView').style.display = 'none';
            document.getElementById('successView').style.display = 'block';
        });

        // Smooth Transitions
        document.querySelectorAll('a').forEach(anchor => {
            anchor.addEventListener('click', function(e) {
                const href = this.getAttribute('href');
                if (href && !href.startsWith('#') && !href.startsWith('https://')) {
                    e.preventDefault();
                    document.getElementById('preloader').classList.remove('hidden');
                    setTimeout(() => { window.location.href = href; }, 800);
                }
            });
        });
    </script>
</body>

</html>
