<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings | Glamour Partner Console</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .profile-form-clean {
            max-width: 600px;
        }

        .input-group-clean {
            margin-bottom: 24px;
        }

        .input-group-clean label {
            display: block;
            font-size: 11px;
            font-weight: 800;
            color: var(--glam-gold);
            letter-spacing: 1px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .input-group-clean input {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            padding: 14px 18px;
            border-radius: 12px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .input-group-clean input:focus {
            border-color: var(--glam-gold);
            background: rgba(255, 255, 255, 0.05);
        }
    </style>
</head>

<body>
    <!-- ================= PRELOADER ================= -->
    <div class="glam-preloader" id="preloader">
        <svg class="loader-logo" viewBox="0 0 100 100">
            <g transform="translate(50,50)" fill="currentColor">
                <ellipse cx="0" cy="-22" rx="10" ry="20" transform="rotate(0)"/>
                <ellipse cx="0" cy="-22" rx="10" ry="20" transform="rotate(60)"/>
                <ellipse cx="0" cy="-22" rx="10" ry="20" transform="rotate(120)"/>
                <ellipse cx="0" cy="-22" rx="10" ry="20" transform="rotate(180)"/>
                <ellipse cx="0" cy="-22" rx="10" ry="20" transform="rotate(240)"/>
                <ellipse cx="0" cy="-22" rx="10" ry="20" transform="rotate(300)"/>
                <circle cx="0" cy="0" r="8"/>
            </g>
        </svg>
    </div>

    <div class="dash-wrapper page-fade-in">
        <!-- SIDEBAR -->
        <aside class="dash-sidebar">
            <div style="margin-bottom: 50px;">
                <a href="index.html" class="nav-logo">
                    <svg width="24" height="24" viewBox="0 0 100 100">
                        <g transform="translate(50,50)" fill="currentColor">
                            <ellipse cx="0" cy="-22" rx="10" ry="20" transform="rotate(0)"/>
                            <ellipse cx="0" cy="-22" rx="10" ry="20" transform="rotate(60)"/>
                            <ellipse cx="0" cy="-22" rx="10" ry="20" transform="rotate(120)"/>
                            <ellipse cx="0" cy="-22" rx="10" ry="20" transform="rotate(180)"/>
                            <ellipse cx="0" cy="-22" rx="10" ry="20" transform="rotate(240)"/>
                            <ellipse cx="0" cy="-22" rx="10" ry="20" transform="rotate(300)"/>
                            <circle cx="0" cy="0" r="8"/>
                        </g>
                    </svg>
                    <span>GLAMOUR</span>
                </a>
            </div>

            <nav style="display: flex; flex-direction: column; gap: 10px;">
                <a href="dashboard.html" style="padding: 15px 20px; color: var(--glam-text-muted); font-weight: 600; display: flex; align-items: center; gap: 12px; transition: 0.3s;">
                    <i class="bi bi-grid-fill"></i> Hub Console
                </a>
                <a href="wallet.html" style="padding: 15px 20px; color: var(--glam-text-muted); font-weight: 600; display: flex; align-items: center; gap: 12px; transition: 0.3s;">
                    <i class="bi bi-wallet2"></i> Wallet & History
                </a>
                <a href="profile.html" style="background: rgba(201, 168, 76, 0.1); color: var(--glam-gold); padding: 15px 20px; border-radius: 12px; font-weight: 700; display: flex; align-items: center; gap: 12px;">
                    <i class="bi bi-person-fill"></i> Account Settings
                </a>
            </nav>

            <div style="margin-top: auto; padding-top: 40px; border-top: 1px solid var(--glass-border);">
                <a href="login.html" style="color: #FF4D4D; font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 12px;">
                    <i class="bi bi-box-arrow-right"></i> Log Out
                </a>
            </div>
        </aside>

        <!-- MAIN AREA -->
        <main class="dash-main">
            <div class="dash-topbar">
                <div>
                    <h1 style="font-size: 28px; color: white; font-family: 'Outfit'; font-weight: 900;">ACCOUNT SETTINGS</h1>
                    <p style="font-size: 13px; color: var(--glam-text-muted);">Manage your partner credentials and identity.</p>
                </div>
            </div>

            <!-- PROFILE FORM -->
            <div class="profile-form-clean">
                <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 40px; padding: 20px; background: var(--glam-bg-accent); border-radius: 20px; border: 1px solid var(--glass-border);">
                    <div style="width: 60px; height: 60px; background: var(--glam-gold); border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 900; color: var(--glam-bg);" id="userInitial">G</div>
                    <div>
                        <h4 style="color: white; font-size: 18px; font-family: 'Outfit';" id="userName">PARTNER</h4>
                        <p style="color: var(--glam-cyan); font-size: 11px; font-weight: 800;">VERIFIED GLAM PARTNER</p>
                    </div>
                </div>

                <form id="profileForm">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                        <div class="input-group-clean">
                            <label>First Name</label>
                            <input type="text" value="Partner" id="formFirstName">
                        </div>
                        <div class="input-group-clean">
                            <label>Last Name</label>
                            <input type="text" value="Member">
                        </div>
                    </div>

                    <div class="input-group-clean">
                        <label>Digital Email</label>
                        <input type="email" value="partner@glamour.app" disabled style="opacity: 0.5; cursor: not-allowed;">
                    </div>

                    <div class="input-group-clean">
                        <label>Mobile Number (WhatsApp)</label>
                        <input type="tel" value="+234 000 000 0000">
                    </div>

                    <button type="submit" class="btn-movement-editorial" style="padding: 15px 40px; font-size: 14px;">Update Identity</button>
                </form>
            </div>
        </main>
    </div>

    <!-- MOBILE HEADER -->
    <div class="mobile-dash-header" style="display: none; padding: 20px; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--glass-border); background: var(--glam-bg-accent);">
        <div class="nav-logo" style="font-size: 18px;">GLAMOUR</div>
        <div style="width: 36px; height: 36px; background: var(--glam-gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; color: var(--glam-bg);">G</div>
    </div>

    <!-- Mobile Bottom Nav -->
    <nav class="mobile-dash-nav" style="display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(10, 8, 6, 0.95); backdrop-filter: blur(20px); border-top: 1px solid var(--glass-border); padding: 15px 0; justify-content: space-around; z-index: 1000;">
        <a href="dashboard.html" style="color: var(--glam-text-muted); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; font-weight: 700;">
            <i class="bi bi-grid-fill" style="font-size: 18px;"></i> HUB
        </a>
        <a href="wallet.html" style="color: var(--glam-text-muted); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; font-weight: 700;">
            <i class="bi bi-wallet2" style="font-size: 18px;"></i> WALLET
        </a>
        <a href="profile.html" style="color: var(--glam-gold); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; font-weight: 700;">
            <i class="bi bi-person-fill" style="font-size: 18px;"></i> PROFILE
        </a>
    </nav>

    <script>
        window.addEventListener('load', () => {
            document.getElementById('preloader').classList.add('hidden');
        });

        document.addEventListener('DOMContentLoaded', () => {
            const fullName = localStorage.getItem('fx_username') || 'PARTNER';
            document.getElementById('userName').textContent = fullName.toUpperCase();
            document.getElementById('formFirstName').value = fullName;
            document.getElementById('userInitial').textContent = fullName.charAt(0).toUpperCase();
        });

        document.querySelectorAll('a').forEach(anchor => {
            anchor.addEventListener('click', function(e) {
                const href = this.getAttribute('href');
                if (href && !href.startsWith('#') && !href.startsWith('https://')) {
                    e.preventDefault();
                    document.getElementById('preloader').classList.remove('hidden');
                    setTimeout(() => { window.location.href = href; }, 800);
                }
            });
        });
    </script>
</body>

</html>
